<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Tracker</title>
    <script src="./grocery_Tracker.js" defer></script>
</head>
<body>
    <h1>Calculate the total amount of the purchased grocery items</h1>
    <div>
        <p>
            Enter Grocery-1 Amount:
            <label for="grocery1"></label>
            <input type="number" id="grocery1" placeholder="0.00">
        </p>
        <p>
            Enter Grocery-2 Amount:
            <label for="grocery2"></label>
            <input type="number" id="grocery2" placeholder="0.00">
        </p>
        <p>
            Enter Grocery-3 Amount:
            <label for="grocery3"></label>
            <input type="number" id="grocery3" placeholder="0.00">
        </p>
    </div>
    <div>
        <button id="calculateTotal">
            Calculate Total Amount
        </button>
    </div>
    </br>
    <div>
        <span id="totalAmount"></span>
    </div>
</body>
</html>
